name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install numpy==2.5.3 scipy==1.18.1 matplotlib==3.11.2 pillow==12.3.0
      # Engine suite: compiles the exact gen~ codebox to C (gcc) and checks it
      # against the SDD-3000 specs. Exits 1 only on unexpected failures.
      - name: Engine validation suite
        run: python tests/run_tests.py
      - name: Device container checks
        run: python tools/inspect_amxd.py
      # Byte-for-byte rebuild of the shipped device. The UI preview PNG and the
      # audio renders are left to tools/verify_release.py, because font
      # rasterisation and float libraries differ between machines.
      - name: Committed device matches a fresh build
        run: |
          python tools/build_amxd.py
          git diff --stat --exit-code -- dist/ src/gen/ src/max/
